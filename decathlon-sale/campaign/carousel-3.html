<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>IG carousel 3/3 — Shop by budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_artboard.css"></head><body>
<div class="board" style="width:1080px;height:1080px;background:#1A2A34">
  <img class="logo" src="../assets/decathlon-logo.png" alt="Decathlon" style="left:64px;top:56px;width:172px;height:42px">
  <div style="position:absolute;left:64px;right:64px;top:210px">
    <div class="kicker" style="font-size:20px;color:rgba(255,255,255,.6)">Shop by budget</div>
    <h2 class="title" style="margin-top:22px;font-size:96px;line-height:.9">Every price<br>already down 25%</h2>
    <div style="margin-top:56px;border-top:1px solid rgba(255,255,255,.18)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:26px 0;border-bottom:1px solid rgba(255,255,255,.18)">
        <span style="font-size:58px;font-weight:700;font-style:italic;color:#FFEA28;line-height:1">Under ₹ 499</span>
        <span class="meta" style="font-size:19px;color:rgba(255,255,255,.65)">1,860 items</span></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:26px 0;border-bottom:1px solid rgba(255,255,255,.18)">
        <span style="font-size:58px;font-weight:700;font-style:italic;color:#FFEA28;line-height:1">Under ₹ 999</span>
        <span class="meta" style="font-size:19px;color:rgba(255,255,255,.65)">2,940 items</span></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:26px 0;border-bottom:1px solid rgba(255,255,255,.18)">
        <span style="font-size:58px;font-weight:700;font-style:italic;color:#FFEA28;line-height:1">Under ₹ 1,999</span>
        <span class="meta" style="font-size:19px;color:rgba(255,255,255,.65)">2,110 items</span></div>
    </div>
  </div>
  <div style="position:absolute;left:64px;bottom:70px;display:flex;align-items:center;gap:24px">
    <span class="chip" style="font-size:20px;letter-spacing:.16em;padding:14px 24px"><span>Shop the sale →</span></span>
    <span class="meta" style="font-size:20px;color:rgba(255,255,255,.45)">3 / 3</span>
  </div>
</div>
</body></html>
