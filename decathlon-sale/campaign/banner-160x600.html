<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Banner 160x600</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_artboard.css"></head><body>
<div class="board" style="width:160px;height:600px">
  <div class="photo" style="inset:auto 0 0 0;height:236px;background-image:url(../assets/hero.png);background-position:58% 42%;clip-path:polygon(0 10%,100% 0,100% 100%,0 100%)"></div>
  <div style="position:absolute;left:0;right:0;top:0;height:400px;background:linear-gradient(160deg,#006ba2,#0082C3 70%)"></div>
  <div class="lines"><i class="line" style="left:96px;top:-30px;width:8px;height:700px;background:var(--yellow);opacity:.9"></i>
  <i class="line" style="left:114px;top:-30px;width:3px;height:700px;background:rgba(255,255,255,.4)"></i></div>
  <img class="logo" src="../assets/decathlon-logo.png" alt="Decathlon" style="left:14px;top:16px;width:88px;height:22px;z-index:3">
  <div style="position:absolute;left:14px;right:14px;top:66px;z-index:3">
    <h1 class="title" style="font-size:40px;line-height:.84">Your<br>next<br>move</h1>
    <div class="slab" style="margin-top:14px;padding:5px 10px"><span style="font-size:17px">25% off</span></div>
    <p style="margin:16px 0 0;font-size:12px;line-height:1.4;color:rgba(255,255,255,.9)">70 sports.<br>10,000+ items.<br>No code needed.</p>
  </div>
  <div style="position:absolute;left:14px;bottom:16px;z-index:4">
    <span class="chip chip--red" style="font-size:9px;letter-spacing:.14em;padding:7px 10px"><span>Shop →</span></span>
  </div>
</div>
</body></html>
