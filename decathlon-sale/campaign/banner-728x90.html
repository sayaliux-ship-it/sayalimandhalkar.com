<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Banner 728x90</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_artboard.css"></head><body>
<div class="board" style="width:728px;height:90px">
  <div class="photo" style="inset:0 0 0 58%;background-image:url(../assets/hero.png);background-position:56% 42%;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%)"></div>
  <div class="scrim" style="left:58%;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);background:linear-gradient(100deg,#0082C3,rgba(0,130,195,.25) 72%,rgba(0,60,92,.4))"></div>
  <div style="position:absolute;left:0;top:0;bottom:0;width:62%;background:linear-gradient(90deg,#006ba2,#0082C3 74%)"></div>
  <div class="lines"><i class="line" style="left:420px;top:-14px;width:9px;height:120px;background:var(--yellow)"></i>
  <i class="line" style="left:438px;top:-14px;width:4px;height:120px;background:rgba(255,255,255,.45)"></i></div>
  <img class="logo" src="../assets/decathlon-logo.png" alt="Decathlon" style="left:20px;top:31px;width:104px;height:26px">
  <div style="position:absolute;left:150px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:18px;z-index:3">
    <span class="title" style="font-size:30px;line-height:1">Your next move</span>
    <span class="slab" style="padding:4px 11px"><span style="font-size:19px">25% off sitewide</span></span>
  </div>
  <div style="position:absolute;right:18px;top:50%;transform:translateY(-50%);z-index:4">
    <span class="chip chip--red" style="font-size:10px;letter-spacing:.14em;padding:8px 13px"><span>Shop now →</span></span>
  </div>
</div>
</body></html>
