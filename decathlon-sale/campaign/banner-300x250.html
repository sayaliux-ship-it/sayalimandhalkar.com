<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Banner 300x250</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_artboard.css"></head><body>
<div class="board" style="width:300px;height:250px">
  <div class="photo" style="inset:0 0 0 42%;background-image:url(../assets/hero.png);background-position:58% 40%;clip-path:polygon(24% 0,100% 0,100% 100%,0 100%)"></div>
  <div class="scrim" style="left:42%;clip-path:polygon(24% 0,100% 0,100% 100%,0 100%);background:linear-gradient(100deg,#0082C3,rgba(0,130,195,.3) 70%,rgba(0,60,92,.4))"></div>
  <div style="position:absolute;left:0;top:0;bottom:0;width:52%;background:linear-gradient(90deg,#006ba2,#0082C3 72%)"></div>
  <div class="lines"><i class="line" style="left:132px;top:-20px;width:9px;height:300px;background:var(--yellow)"></i>
  <i class="line" style="left:150px;top:-20px;width:4px;height:300px;background:rgba(255,255,255,.45)"></i></div>
  <img class="logo" src="../assets/decathlon-logo.png" alt="Decathlon" style="left:16px;top:14px;width:82px;height:20px">
  <div style="position:absolute;left:16px;top:54px;z-index:3">
    <h1 class="title" style="font-size:38px;line-height:.86">Your<br>next<br>move</h1>
    <div class="slab" style="margin-top:10px;padding:4px 9px"><span style="font-size:16px">25% off</span></div>
  </div>
  <div style="position:absolute;left:16px;bottom:14px;z-index:3">
    <span class="chip chip--red" style="font-size:9px;letter-spacing:.14em;padding:6px 10px"><span>Shop the sale →</span></span>
  </div>
</div>
</body></html>
