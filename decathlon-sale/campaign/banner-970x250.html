<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Banner 970x250</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_artboard.css"></head><body>
<div class="board" style="width:970px;height:250px">
  <div class="photo" style="inset:0 0 0 46%;background-image:url(../assets/hero.png);background-position:58% 40%;clip-path:polygon(16% 0,100% 0,100% 100%,0 100%)"></div>
  <div class="scrim" style="left:46%;clip-path:polygon(16% 0,100% 0,100% 100%,0 100%);background:linear-gradient(100deg,#0082C3,rgba(0,130,195,.28) 66%,rgba(0,60,92,.4))"></div>
  <div style="position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#006ba2,#0082C3 72%)"></div>
  <div class="lines"><i class="line" style="left:404px;top:-30px;width:18px;height:320px;background:var(--yellow)"></i>
  <i class="line" style="left:438px;top:-30px;width:7px;height:320px;background:rgba(255,255,255,.5)"></i>
  <i class="line" style="left:456px;top:-30px;width:3px;height:320px;background:rgba(255,255,255,.25)"></i></div>
  <img class="logo" src="../assets/decathlon-logo.png" alt="Decathlon" style="left:26px;top:22px;width:116px;height:29px;z-index:3">
  <div style="position:absolute;left:26px;top:74px;z-index:3">
    <h1 class="title" style="font-size:54px;line-height:.86">Your next<br>move</h1>
    <div class="slab" style="margin-top:14px;padding:6px 14px"><span style="font-size:24px">25% off sitewide</span></div>
  </div>
  <img src="../assets/p-rockrider-cut.png" alt="" style="position:absolute;left:392px;bottom:-14px;width:196px;z-index:4;filter:drop-shadow(14px 18px 24px rgba(0,40,62,.45))">
  <div style="position:absolute;right:26px;bottom:26px;z-index:5;text-align:right">
    <div class="meta" style="font-size:11px;color:rgba(255,255,255,.75)">70 sports · 10,000+ items · Ends Sunday</div>
    <div style="margin-top:12px"><span class="chip chip--red" style="font-size:12px;letter-spacing:.14em;padding:10px 16px"><span>Shop the sale →</span></span></div>
  </div>
</div>
</body></html>
