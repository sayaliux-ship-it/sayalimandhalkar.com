<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>IG carousel 1/3 — Six sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_artboard.css"></head><body>
<div class="board" style="width:1080px;height:1080px;background:#0F2029">
  <div class="lines"><i class="line" style="left:940px;top:-60px;width:26px;height:1200px;background:var(--yellow)"></i>
  <i class="line" style="left:992px;top:-60px;width:10px;height:1200px;background:rgba(255,255,255,.4)"></i></div>
  <img class="logo" src="../assets/decathlon-logo.png" alt="Decathlon" style="left:64px;top:56px;width:172px;height:42px">
  <div style="position:absolute;left:64px;top:250px;right:180px">
    <span class="rule" style="width:64px;height:14px"></span>
    <div class="kicker" style="margin-top:24px;font-size:20px;color:rgba(255,255,255,.6)">Pick your sport</div>
    <h2 class="title" style="margin-top:22px;font-size:132px;line-height:.88">Six sports.<br>One sale.</h2>
    <p style="margin:36px 0 0;font-size:28px;line-height:1.45;color:rgba(255,255,255,.68);max-width:620px">Every category discounted. Every price already marked down 25%.</p>
  </div>
  <div style="position:absolute;left:64px;bottom:70px;display:flex;align-items:center;gap:20px">
    <span class="meta" style="font-size:20px;color:#FFEA28">Swipe →</span>
    <span class="meta" style="font-size:20px;color:rgba(255,255,255,.45)">1 / 3</span>
  </div>
</div>
