<title>Your Call Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap">

<style>
/* ── Shell tokens. The phones below are fixed artifacts and stay literal in
      both themes, the way a device screenshot would. Only the chrome adapts. */
:root{
  --ground:#f5f5f5; --panel:#ffffff; --ink:#172613; --ink-70:rgb(23 38 19 / .70);
  --hair:rgb(23 38 19 / .10); --pill:#ffffff; --pill-hover:#ceebc2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#141f10; --panel:#1f3019; --ink:#ceebc2; --ink-70:rgb(206 235 194 / .70);
    --hair:rgb(206 235 194 / .16); --pill:#1f3019; --pill-hover:#3a4c34;
  }
}
:root[data-theme="dark"]{
  --ground:#141f10; --panel:#1f3019; --ink:#ceebc2; --ink-70:rgb(206 235 194 / .70);
  --hair:rgb(206 235 194 / .16); --pill:#1f3019; --pill-hover:#3a4c34;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #f0710c;outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@keyframes nouri-lock{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes nouri-rise{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes nouri-burst{
  0%{transform:translate3d(0,0,0) scale(.4);opacity:0}
  12%{opacity:1}
  100%{transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot)) scale(1);opacity:0}
}
@keyframes nouri-fade{0%{opacity:0}100%{opacity:1}}

.wrap{min-height:100vh;padding:40px 32px 56px;display:flex;flex-direction:column;gap:26px;align-items:center}
.bar{width:100%;max-width:1060px;display:flex;flex-direction:column;gap:18px}
.titlerow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:-.01em;padding:5px 10px;border-radius:9999px;background:#172613;color:#f5f5f5;flex:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tag{background:#ceebc2;color:#172613}
}
:root[data-theme="dark"] .tag{background:#ceebc2;color:#172613}
.tt{font-size:18px;font-weight:600;letter-spacing:-.03em}
.sl{font-size:13px;line-height:1.4;color:var(--ink-70)}
.reset{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-70);text-decoration:underline;text-underline-offset:3px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.sp{
  padding:8px 13px;border-radius:9999px;background:var(--pill);
  border:1px solid var(--hair);font-size:12px;font-weight:600;letter-spacing:-.01em;
  transition:background 150ms cubic-bezier(0,0,.2,1);white-space:nowrap;
}
.sp:hover{background:var(--pill-hover)}
.sp[aria-current="true"]{background:#172613;color:#f5f5f5;border-color:#172613}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .sp[aria-current="true"]{background:#ceebc2;color:#172613;border-color:#ceebc2}
}
:root[data-theme="dark"] .sp[aria-current="true"]{background:#ceebc2;color:#172613;border-color:#ceebc2}

.stagerow{display:flex;align-items:center;gap:26px;max-width:100%}
.nav{
  flex:none;width:52px;height:52px;border-radius:9999px;background:var(--pill);
  border:1px solid var(--hair);box-shadow:0 4px 24px rgb(23 38 19 / .05);
  display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;
  transition:background 150ms cubic-bezier(0,0,.2,1),transform 200ms cubic-bezier(0,0,.2,1);
}
.nav:hover:not(:disabled){background:var(--pill-hover)}
.nav:active:not(:disabled){transform:scale(.97)}
.nav:disabled{opacity:.35;cursor:not-allowed}
.nav.primary{background:#172613;color:#f5f5f5;border-color:#172613}
.nav.primary:hover:not(:disabled){background:#3a4c34}
.stage{display:flex;justify-content:center;gap:56px;min-width:433px;position:relative}
.note{margin:0;max-width:560px;text-align:center;font-size:13px;line-height:1.5;color:var(--ink-70)}
.hint{margin:0;font-size:12px;line-height:1.5;color:var(--ink-70);opacity:.85;text-align:center}
.hint b{font-weight:700;opacity:1}
.credits{margin:6px 0 0;max-width:660px;text-align:center;font-size:11px;line-height:1.6;color:var(--ink-70);opacity:.75}
.credits a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.credits a:hover{color:#f0710c}

/* ── Phone chassis — literal, both themes ─────────────────────────── */
.chassis{flex:none;width:413px;height:872px;padding:10px;border-radius:54px;background:#172613;box-shadow:0 4px 24px rgb(23 38 19 / .05)}
.screen{position:relative;width:393px;height:852px;border-radius:44px;overflow:hidden;background:#f5f5f5;display:flex;flex-direction:column;color:#172613}
.sb{position:relative;flex:none;height:54px;padding:0 26px;display:flex;align-items:center;justify-content:space-between}
.home{flex:none;height:22px;display:flex;align-items:center;justify-content:center}
.homebar{width:134px;height:5px;border-radius:9999px;background:rgb(23 38 19 / .35)}
.card{position:relative;width:100%;border-radius:24px;background:#ffffff;border:1px solid rgb(23 38 19 / .10);box-shadow:0 4px 24px rgb(23 38 19 / .05);transition:transform 200ms cubic-bezier(0,0,.2,1)}
.card:active{transform:scale(.985)}
.cta{
  width:100%;height:54px;border-radius:8px;background:#172613;color:#f5f5f5;
  font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;
  transition:background 150ms cubic-bezier(0,0,.2,1),transform 200ms cubic-bezier(0,0,.2,1);
}
.cta:hover{background:#3a4c34}
.cta:active{transform:scale(.97)}
.cta[disabled]{background:#e8e8e8;color:rgb(23 38 19 / .38);cursor:not-allowed}
.cta[disabled]:hover{background:#e8e8e8}
.prep{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid rgb(23 38 19 / .10);width:100%}
.dot{flex:none;width:26px;height:26px;border-radius:9999px;border:1.5px solid rgb(23 38 19 / .25)}
.dot.on{background:#172613;color:#ceebc2;border-color:#172613;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.mood{flex:1;height:54px;border-radius:9999px;background:#ffffff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 24px rgb(23 38 19 / .05);transition:transform 200ms cubic-bezier(0,0,.2,1)}
.mood:active{transform:scale(.97)}
.mood.on{background:#ceebc2;border:2px solid #172613;box-shadow:none}
.tapme{cursor:pointer}
.notecard{border-radius:12px;background:#fff;border:1px solid rgb(23 38 19 / .10);padding:15px 16px;font-size:15px;line-height:1.5;min-height:74px;width:100%;font-family:inherit;color:#172613;resize:none}
.notecard::placeholder{color:rgb(23 38 19 / .38)}

.tapcue{
  position:absolute;z-index:5;pointer-events:none;
  font-size:11px;font-weight:700;letter-spacing:-.01em;
  background:#f0710c;color:#172613;padding:5px 10px;border-radius:9999px;
  animation:nouri-fade 400ms cubic-bezier(0,0,.2,1) both;white-space:nowrap;
}
</style>

<div class="wrap">
  <div class="bar">
    <div class="titlerow">
      <span class="tag">Happy path</span>
      <span class="tt">Your Call — click through the flow</span>
      <span class="sl" id="steplabel"></span>
      <button class="reset" id="reset">Start over</button>
    </div>
    <div class="steps" id="steps"></div>
  </div>

  <div class="stagerow">
    <button class="nav" id="prev" aria-label="Previous step">‹</button>
    <div class="stage" id="stage"></div>
    <button class="nav primary" id="next" aria-label="Next step">›</button>
  </div>

  <p class="note" id="stepnote"></p>
  <p class="hint" id="hint"></p>

</div>

/* ── 5 · Dual check-in (ScreenC) ───────────────────────────────── */
function confettiHTML(){
  const colors = ['#ceebc2','#fae899','#bae8ef','#aec8e1','#172613'];
  let out = '';
  for (let i=0;i<44;i++){
    const a = (i/44)*Math.PI*2 + (i%3)*0.18;
    const dist = 180 + ((i*37)%260);
    const pill = i%3===0;
    out += `<div style="position:absolute;left:50%;top:34%;width:${pill?14:9}px;height:${pill?6:9}px;border-radius:9999px;background:${colors[i%colors.length]};opacity:0;--dx:${(Math.cos(a)*dist).toFixed(0)}px;--dy:${(Math.sin(a)*dist*0.8+120).toFixed(0)}px;--rot:${(i*53)%360}deg;animation:nouri-burst ${1200+(i%5)*220}ms cubic-bezier(0,0,.2,1) ${(i%7)*45}ms forwards"></div>`;
  }
  return `<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden">${out}</div>`;
}

/* ─────────────────────────────────────────────────────────────────

const $ = id => document.getElementById(id);

function goto(n){
  S.step = Math.max(0, Math.min(7, n));
  if (S.step === 1){ S.pick = null; S.locked = false; }
  if (S.step === 2 && S.pick == null){ S.pick = 0; }
  render();
}

function render(){
  const [label, note, hint] = STEPS[S.step];
  $('steplabel').textContent = label;
  $('stepnote').textContent = note;
  $('hint').innerHTML = hint;
  $('stage').innerHTML = SCREENS[S.step]();
  $('prev').disabled = S.step === 0;
  $('next').disabled = S.step === 7;
  [...$('steps').children].forEach((b,i) => b.setAttribute('aria-current', String(i === S.step)));
}

$('steps').innerHTML = ['1 · Notification','2 · Pick, empty','3 · Pick, selected','4 · Handoff','5 · Dual check-in','6 · Paused streak','7 · Recap','8 · Coach view']
  .map((t,i)=>`<button class="sp" data-step="${i}">${t}</button>`).join('');
$('steps').addEventListener('click', e => {
  const b = e.target.closest('[data-step]'); if (b) goto(+b.dataset.step);
});
$('prev').addEventListener('click', () => goto(S.step - 1));
$('next').addEventListener('click', () => goto(S.step + 1));
$('reset').addEventListener('click', () => { S = init(); render(); });

$('stage').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, i = +el.dataset.i;
  switch (act) {
    case 'open-pick':  goto(1); break;
    case 'pick':
      S.pick = i; S.locked = false;
      if (S.step === 1) { S.step = 2; }
      render();
      break;
    case 'lock':
      S.locked = true; render();
      setTimeout(() => { if (S.locked && S.step === 2) goto(3); }, 950);
      break;
    case 'prep':       S.prep[i] = !S.prep[i]; render(); break;
    case 'were-in':    goto(4); break;
    case 'back-pick':  goto(2); break;
    case 'mood':       S.mood = i; render(); break;
    case 'mark-done':  S.parentDone = true; S.burstKey++; render(); break;
    case 'nudge':      S.nudged = true; render(); break;
    case 'back-recap': goto(6); break;
    case 'save-note':  S.noteSaved = true; render(); break;
  }
});
$('stage').addEventListener('input', e => {
  const el = e.target.closest('[data-act="note"]');
  if (el) { S.note = el.value; S.noteSaved = false; }
});

window.addEventListener('keydown', e => {
  if (e.target.matches('textarea, input')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); goto(S.step + 1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); goto(S.step - 1); }
});

render();
})();
</script>
