<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Core</title>
  <link rel="stylesheet" href="../../styles.css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>
    body{margin:0;padding:18px;background:var(--nouri-offwhite);font-family:var(--nouri-font-sans);color:var(--nouri-deep-green)}
    .lbl{font-size:11px;font-weight:700;letter-spacing:-.01em;opacity:.55;margin-bottom:9px}
    .grp{display:flex;flex-direction:column;gap:9px}
    .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Badge, TextLink, Stat, Avatar } = window.HeyNouriDesignSystem_a8244f;
    const G = ({ label, children }) => (
      <div className="grp"><div className="lbl">{label}</div><div className="row">{children}</div></div>
    );
    ReactDOM.createRoot(document.getElementById('root')).render(
      <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
        <G label="Button — one carrot per screen, deep-green label, 8px radius">
          <Button arrow>Get started</Button>
          <Button size="app" arrow>Log a meal</Button>
          <Button variant="onDark" style={{ background:'var(--nouri-fresh-mint)' }}>On a dark band</Button>
          <Button disabled>Checking…</Button>
          <TextLink>How it works</TextLink>
        </G>
        <G label="Badge — pill, 12/700, sentence case. Never uppercase.">
          <Badge icon="✓">Pediatrician managed</Badge>
          <Badge tone="white">In network with 500+ plans</Badge>
          <Badge tone="sun">7 day streak</Badge>
          <Badge tone="clinical">Medication</Badge>
        </G>
        <G label="Stat — precision is the credibility device · Avatar — circle = care team only">
          <Stat value="3–6" unit="lbs" caption="Average weight loss per month" />
          <Stat value="96" unit="%" caption="Of families have a $0 co-pay" />
          <div style={{ display:'flex', gap:14, alignItems:'flex-end', marginLeft:16 }}>
            <Avatar variant="testimonial" size={56} name="Sylvia" />
            <Avatar variant="team" size={56} name="Coach Amy" />
          </div>
        </G>
      </div>
    );
  </script>
</body>
</html>
