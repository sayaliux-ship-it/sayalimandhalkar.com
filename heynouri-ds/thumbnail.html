<!DOCTYPE html>
<html><head><meta charset="utf-8" /><title>Hey Nouri</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;justify-content:space-between;
       background:var(--nouri-deep-green);color:var(--nouri-fresh-mint);
       font-family:var(--nouri-font-sans);padding:36px;box-sizing:border-box;overflow:hidden}
  .mark{font-size:60px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .sub{font-size:15px;line-height:1.45;opacity:.75;max-width:34ch;margin-top:12px}
  .strip{display:flex;gap:8px;margin-top:28px}
  .strip i{flex:1;height:52px;border-radius:9999px}
</style></head>
<body>
  <div>
    <div class="mark">HeyNouri</div>
    <div class="sub">Pediatrician-led weight care for kids and teens. Nine colors, one typeface, two shadows, and a shape language built entirely out of curves.</div>
  </div>
  <div>
    <div class="strip">
      <i style="background:#ceebc2"></i><i style="background:#fae899"></i>
      <i style="background:#bae8ef"></i><i style="background:#aec8e1"></i>
      <i style="background:#f0710c;flex:.28"></i>
    </div>
    <svg viewBox="0 0 600 40" preserveAspectRatio="none" style="display:block;width:100%;height:34px;margin-top:16px" aria-hidden="true">
      <path d="M0,40 L0,22 Q300,-14 600,22 L600,40 Z" fill="rgba(206,235,194,.16)"/>
    </svg>
  </div>
</body></html>
